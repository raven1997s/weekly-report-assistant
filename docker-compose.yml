version: '3.8'

services:
  weekly-report:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weekly-report-assistant
    ports:
      - "3333:3000"
    volumes:
      # 挂载数据目录，确保数据持久化
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_URL=/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
